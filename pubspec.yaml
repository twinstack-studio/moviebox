name: moviebox
description: "MovieBox - book movie tickets, snacks and more."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_localizations:
    sdk: flutter
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/posters/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
    # Urdu script (used automatically for Urdu text).
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#0B0B10"
    theme_color: "#E0243A"

flutter_native_splash:
  color: "#0B0B10"
  image: assets/branding/splash.png
  android_12:
    color: "#0B0B10"
    image: assets/branding/splash.png
  web: false
